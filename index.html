<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A.G.E.N.T. Terminal // DragonCon Grid</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --term-green: #00ff66;
      --term-dim: #008837;
      --term-alert: #ff3333;
      --term-warn: #ffcc00;
      --font-stack: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--term-green);
      font-family: var(--font-stack);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 10px;
    }

    .terminal-container {
      width: 100%;
      max-width: 800px;
      height: 90vh;
      background: #050709;
      border: 2px solid var(--term-green);
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* CRT Scanline Overlay */
    .terminal-container::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
    }

    .terminal-header {
      background-color: rgba(0, 255, 102, 0.1);
      border-bottom: 1px solid var(--term-green);
      padding: 8px 12px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .terminal-body {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .line {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .system { color: var(--term-green); }
    .dim { color: var(--term-dim); }
    .alert { color: var(--term-alert); font-weight: bold; }
    .warn { color: var(--term-warn); }
    .user-input { color: #ffffff; }

    /* Blinking Cursor at the End of Typing */
    .typing::after {
      content: '█';
      animation: blink 0.8s infinite;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .terminal-input-line {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-top: 1px solid var(--term-dim);
      background: #080a0d;
    }

    .prompt {
      color: var(--term-green);
      margin-right: 8px;
      font-weight: bold;
    }

    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: var(--font-stack);
      font-size: 1rem;
    }

    .glitch {
      animation: glitch 0.2s ease infinite alternate;
    }

    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    <div class="terminal-header">
      <span>SYS_NAME: DRAGON_NET_V2.6</span>
      <span id="node-status">STATUS: INITIALIZING...</span>
    </div>
    
    <div class="terminal-body" id="terminal-body"></div>

    <div class="terminal-input-line">
      <span class="prompt">OPERATIVE@GRID:&gt;</span>
      <input type="text" id="cmd-input" placeholder="Type command..." autofocus autocomplete="off" />
    </div>
  </div>

  <script>
    /******************************************************************
     * AUDIO ENGINE
     ******************************************************************/
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq = 800, type = 'sine', duration = 0.05) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playKeyClick() {
      // Subtle randomized pitch tick for typing sound
      const freq = 1200 + Math.random() * 400;
      playBeep(freq, 'triangle', 0.015);
    }

    /******************************************************************
     * PUZZLE DATABASE & STATE
     ******************************************************************/
    let gameState = JSON.parse(localStorage.getItem('dragoncon_arg_state')) || {
      currentNode: 1,
      unlockedNodes: [],
      completed: false
    };

    const NODES = {
      1: {
        title: "NODE 1: Skybridge Uplink",
        location: "Hyatt-Marriott Skybridge",
        briefing: "LOCKED. To calibrate frequency, count total light overhead fixtures on the Skybridge (A) and multiply by 10.\nTarget Format: UNLOCK [NUMBER]",
        solution: "1200",
        hint: "Walk across the main Hyatt-to-Marriott skybridge and count every overhead panel light.",
        successText: "FREQUENCY MATCHED. Node 1 overridden. Security protocol lowered."
      },
      2: {
        title: "NODE 2: Visual Matrix",
        location: "Marriott Atrium",
        briefing: "LOCKED. Find the carpet pattern near the Pulse Bar. Input the 4-digit year embedded on the commemorative plaque nearby.\nTarget Format: UNLOCK [YEAR]",
        solution: "1985",
        hint: "Look for historic markers or plaques near the lower level atrium elevators.",
        successText: "VISUAL MATRIX SYNCHRONIZED. Node 2 online."
      },
      3: {
        title: "NODE 3: Core Override",
        location: "AmericasMart / Con Floor",
        briefing: "FINAL NODE. Find an operative carrying at least 8 badge ribbons. Ask for the secret phrase or enter master code.\nTarget Format: OVERRIDE [PASSPHRASE]",
        solution: "CULT OF CARPET",
        hint: "Target ribbon hoarders near registration or major hall corridors.",
        successText: "CRITICAL OVERRIDE SUCCESSFUL. MAINFRAME RESTORED!"
      }
    };

    /******************************************************************
     * TELETYPE TYPING ENGINE
     ******************************************************************/
    const outputElem = document.getElementById('terminal-body');
    const inputElem = document.getElementById('cmd-input');
    const statusElem = document.getElementById('node-status');
    let printQueue = [];
    let isTyping = false;

    // Queue messages so multi-line prints stream sequentially
    function printLine(text, classType = 'system', delay = 15) {
      printQueue.push({ text, classType, delay });
      if (!isTyping) {
        processQueue();
      }
    }

    function processQueue() {
      if (printQueue.length === 0) {
        isTyping = false;
        return;
      }

      isTyping = true;
      const { text, classType, delay } = printQueue.shift();
      const line = document.createElement('div');
      line.className = `line ${classType} typing`;
      outputElem.appendChild(line);

      let charIndex = 0;

      function typeChar() {
        if (charIndex < text.length) {
          line.textContent += text.charAt(charIndex);
          charIndex++;
          outputElem.scrollTop = outputElem.scrollHeight;
          if (Math.random() > 0.3) playKeyClick(); // Sound effect
          setTimeout(typeChar, delay);
        } else {
          line.classList.remove('typing');
          setTimeout(processQueue, 50); // Next item in queue
        }
      }

      typeChar();
    }

    function updateStatusUI() {
      if (gameState.completed) {
        statusElem.textContent = "STATUS: MAINFRAME SECURED";
      } else {
        statusElem.textContent = `STATUS: NODE ${gameState.currentNode}/3 ACTIVE`;
      }
      localStorage.setItem('dragoncon_arg_state', JSON.stringify(gameState));
    }

    function renderNodeBriefing() {
      if (gameState.completed) {
        printLine("==================================================", "system", 5);
        printLine("MISSION COMPLETE. All systems restored. Contact your handler for reward.", "system", 20);
        printLine("==================================================", "system", 5);
        return;
      }

      const activeNode = NODES[gameState.currentNode];
      printLine(`--- [ CURRENT OBJECTIVE: ${activeNode.title} ] ---`, "warn", 15);
      printLine(`LOCATION TARGET: ${activeNode.location}`, "dim", 15);
      printLine(`DIRECTIVE: ${activeNode.briefing}`, "system", 15);
    }

    function initTerminal() {
      printLine("INITIALIZING REMOTE HANDLER TERMINAL v2.6...", "dim", 10);
      printLine("CONNECTING TO DRAGONCON MESH NETWORK...", "dim", 10);
      printLine("ESTABLISHING ENCRYPTED LINK... CONNECTED.", "system", 15);
      printLine("Type 'HELP' for a list of available directives.\n", "system", 15);
      updateStatusUI();
      renderNodeBriefing();
    }

    function processCommand(rawInput) {
      const input = rawInput.trim();
      if (!input) return;

      // Print user input immediately without typing animation
      const userLine = document.createElement('div');
      userLine.className = 'line user-input';
      userLine.textContent = `OPERATIVE@GRID:> ${input}`;
      outputElem.appendChild(userLine);
      outputElem.scrollTop = outputElem.scrollHeight;

      playBeep(600, 'square', 0.03);

      const parts = input.split(' ');
      const cmd = parts[0].toUpperCase();
      const arg = parts.slice(1).join(' ').toUpperCase();

      switch (cmd) {
        case 'HELP':
          printLine("AVAILABLE COMMANDS:", "system", 10);
          printLine("  STATUS          - Display overall mission progress.", "dim", 10);
          printLine("  BRIEF           - Re-print current node objective.", "dim", 10);
          printLine("  HINT            - Request tactical hint from handler.", "dim", 10);
          printLine("  UNLOCK [CODE]   - Submit node unlock credential.", "dim", 10);
          printLine("  OVERRIDE [CODE] - Submit node 3 final override.", "dim", 10);
          printLine("  CLEAR           - Clear terminal window text.", "dim", 10);
          printLine("  RESET           - Reset game data (Irreversible).", "dim", 10);
          break;

        case 'STATUS':
          printLine(`Current Node: ${gameState.currentNode} / 3`, "system", 15);
          printLine(`Unlocked Nodes: ${gameState.unlockedNodes.join(', ') || 'None'}`, "dim", 15);
          break;

        case 'BRIEF':
          renderNodeBriefing();
          break;

        case 'HINT':
          playBeep(400, 'sine', 0.1);
          printLine(`[HANDLERS HINT]: ${NODES[gameState.currentNode].hint}`, "warn", 20);
          break;

        case 'UNLOCK':
        case 'OVERRIDE':
          if (gameState.completed) {
            printLine("All nodes are already unlocked.", "warn", 15);
            break;
          }

          const currentNodeData = NODES[gameState.currentNode];
          if (arg === currentNodeData.solution) {
            playBeep(1000, 'sine', 0.1);
            playBeep(1400, 'sine', 0.15);
            printLine(currentNodeData.successText, "system", 20);
            
            gameState.unlockedNodes.push(gameState.currentNode);
            
            if (gameState.currentNode < 3) {
              gameState.currentNode++;
              updateStatusUI();
              renderNodeBriefing();
            } else {
              gameState.completed = true;
              updateStatusUI();
              renderNodeBriefing();
            }
          } else {
            playBeep(200, 'sawtooth', 0.2);
            outputElem.classList.add('glitch');
            setTimeout(() => outputElem.classList.remove('glitch'), 300);
            printLine("ACCESS DENIED. Invalid credential token submitted.", "alert", 15);
          }
          break;

        case 'CLEAR':
          outputElem.innerHTML = '';
          break;

        case 'RESET':
          localStorage.removeItem('dragoncon_arg_state');
          gameState = { currentNode: 1, unlockedNodes: [], completed: false };
          outputElem.innerHTML = '';
          printLine("SYSTEM MEMORY WIPED.", "alert", 10);
          initTerminal();
          break;

        default:
          playBeep(150, 'sawtooth', 0.1);
          printLine(`Unknown command: '${cmd}'. Type 'HELP' for directive list.`, "alert", 15);
          break;
      }
    }

    inputElem.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        processCommand(inputElem.value);
        inputElem.value = '';
      }
    });

    initTerminal();
  </script>
</body>
</html>
