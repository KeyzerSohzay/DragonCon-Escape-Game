<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>A.G.E.N.T. Terminal // DragonCon Grid</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --term-green: #00ff66;
      --term-dim: #008837;
      --term-alert: #ff3333;
      --term-warn: #ffcc00;
      --font-stack: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--term-green);
      font-family: var(--font-stack);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 10px;
    }

    .terminal-container {
      width: 100%;
      max-width: 800px;
      height: 90vh;
      background: #050709;
      border: 2px solid var(--term-green);
      box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .terminal-header {
      background-color: rgba(0, 255, 102, 0.1);
      border-bottom: 1px solid var(--term-green);
      padding: 8px 12px;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .terminal-body {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.9rem;
      line-height: 1.4;
      -webkit-overflow-scrolling: touch;
    }

    .line {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .typing::after {
      content: '█';
      animation: blink 0.7s infinite;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .system { color: var(--term-green); }
    .dim { color: var(--term-dim); }
    .alert { color: var(--term-alert); font-weight: bold; }
    .warn { color: var(--term-warn); }
    .user-input { color: #ffffff; }

    .terminal-input-line {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-top: 1px solid var(--term-dim);
      background: #080a0d;
    }

    .prompt {
      color: var(--term-green);
      margin-right: 8px;
      font-weight: bold;
      font-size: 0.85rem;
    }

    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-family: var(--font-stack);
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    <div class="terminal-header">
      <span>SYS_NAME: DRAGON_NET_V2.6</span>
      <span id="node-status">STATUS: ONLINE</span>
    </div>
    
    <div class="terminal-body" id="terminal-body"></div>

    <div class="terminal-input-line">
      <span class="prompt">OPERATIVE@GRID:&gt;</span>
      <input type="text" id="cmd-input" placeholder="Type command..." autocomplete="off" spellcheck="false" />
    </div>
  </div>

  <script>
    let gameState = {
      currentNode: 1,
      unlockedNodes: [],
      completed: false
    };

    try {
      const saved = localStorage.getItem('dragoncon_arg_state');
      if (saved) gameState = JSON.parse(saved);
    } catch(e) {}

    const NODES = {
      1: {
        title: "NODE 1: Authentication Gate",
        location: "Command Access",
        briefing: "To enter the game, enter this word that Liam has everyone yell for the password… but is commonly misspelled.",
        solution: "PINUS",
        hint: "It's five letters, starts with P, ends with S... think pine tree genus spelling!",
        successText: "ACCESS GRANTED. Passphrase verified. System authenticated!"
      },
      2: {
        title: "NODE 2: KWANGYA SYNK Matrix",
        location: "Flat / Wilderness Grid",
        briefing: "SECURITY CHECK 2: Multiply the number of aespa members (4) by 2016 (SM Culture Tech unveiling). Add 23 (Atomic weight of Na for Naevis).\nTarget Format: UNLOCK [NUMBER]",
        solution: "8087",
        hint: "(4 * 2016) + 23.",
        successText: "SYNK LEVEL 100%. NAEVIS LINK ESTABLISHED. Node 2 online."
      },
      3: {
        title: "NODE 3: EXOPLANET Force Field",
        location: "EXOPLANET Command Core",
        briefing: "FINAL OVERRIDE: Add original EXO member count (12) to EXO-K debut year (2012), then subtract the total number of member superpowers (12).\nTarget Format: OVERRIDE [NUMBER]",
        solution: "2012",
        hint: "12 + 2012 - 12.",
        successText: "EXOPLANET FORCE FIELD DEACTIVATED. MAINFRAME RESTORED!"
      }
    };

    const outputElem = document.getElementById('terminal-body');
    const inputElem = document.getElementById('cmd-input');
    const statusElem = document.getElementById('node-status');

    // --- TYPEWRITER QUEUE ENGINE ---
    let printQueue = [];
    let isTyping = false;

    function printLine(text, classType = 'system', speed = 15) {
      printQueue.push({ text, classType, speed });
      if (!isTyping) {
        processQueue();
      }
    }

    function processQueue() {
      if (printQueue.length === 0) {
        isTyping = false;
        return;
      }

      isTyping = true;
      const { text, classType, speed } = printQueue.shift();
      const line = document.createElement('div');
      line.className = `line ${classType} typing`;
      outputElem.appendChild(line);

      let index = 0;

      function typeNextChar() {
        if (index < text.length) {
          line.textContent += text.charAt(index);
          index++;
          outputElem.scrollTop = outputElem.scrollHeight;
          setTimeout(typeNextChar, speed);
        } else {
          line.classList.remove('typing');
          setTimeout(processQueue, 30);
        }
      }

      typeNextChar();
    }

    function updateStatusUI() {
      if (gameState.completed) {
        statusElem.textContent = "STATUS: SECURED";
      } else {
        statusElem.textContent = `NODE ${gameState.currentNode}/3 ACTIVE`;
      }
      try {
        localStorage.setItem('dragoncon_arg_state', JSON.stringify(gameState));
      } catch(e) {}
    }

    function renderNodeBriefing() {
      if (gameState.completed) {
        printLine("==================================================", "system", 5);
        printLine("MISSION COMPLETE. All systems restored.", "system", 15);
        printLine("==================================================", "system", 5);
        return;
      }

      const activeNode = NODES[gameState.currentNode];
      printLine(`--- [ CURRENT OBJECTIVE: ${activeNode.title} ] ---`, "warn", 10);
      printLine(`LOCATION TARGET: ${activeNode.location}`, "dim", 10);
      printLine(`DIRECTIVE: ${activeNode.briefing}`, "system", 12);
    }

    function initTerminal() {
      outputElem.innerHTML = '';
      printQueue = [];
      isTyping = false;
      printLine("==================================================", "system", 5);
      printLine("   WELCOME TO YOUR DRAGONCON PUZZLE CHALLENGE", "warn", 10);
      printLine("==================================================", "system", 5);
      printLine("INITIALIZING TERMINAL v2.6...", "dim", 10);
      printLine("LINK ESTABLISHED.", "system", 10);
      printLine("Type 'HELP' for available directives.\n", "system", 10);
      updateStatusUI();
      renderNodeBriefing();
    }

    function verifyAnswer(submittedText) {
      if (gameState.completed) {
        printLine("All nodes are already unlocked.", "warn", 15);
        return;
      }

      const currentNodeData = NODES[gameState.currentNode];
      if (submittedText === currentNodeData.solution) {
        printLine(currentNodeData.successText, "system", 15);
        
        gameState.unlockedNodes.push(gameState.currentNode);
        
        if (gameState.currentNode < 3) {
          gameState.currentNode++;
          updateStatusUI();
          renderNodeBriefing();
        } else {
          gameState.completed = true;
          updateStatusUI();
          renderNodeBriefing();
        }
      } else {
        printLine("ACCESS DENIED. Invalid credential token submitted.", "alert", 15);
      }
    }

    function processCommand(rawInput) {
      const input = rawInput.trim();
      if (!input) return;

      printLine(`OPERATIVE@GRID:> ${input}`, "user-input", 5);

      const parts = input.split(' ');
      const cmd = parts[0].toUpperCase();
      const arg = parts.slice(1).join(' ').toUpperCase();

      switch (cmd) {
        case 'HELP':
          printLine("AVAILABLE COMMANDS:", "system", 10);
          printLine("  STATUS          - Display overall progress.", "dim", 8);
          printLine("  BRIEF           - Show current objective.", "dim", 8);
          printLine("  HINT            - Request tactical hint.", "dim", 8);
          printLine("  UNLOCK [CODE]   - Submit node credential.", "dim", 8);
          printLine("  OVERRIDE [CODE] - Submit node 3 override.", "dim", 8);
          printLine("  CLEAR           - Clear display screen.", "dim", 8);
          printLine("  RESET           - Reset game save data.", "dim", 8);
          break;

        case 'STATUS':
          printLine(`Current Node: ${gameState.currentNode} / 3`, "system", 10);
          printLine(`Unlocked Nodes: ${gameState.unlockedNodes.join(', ') || 'None'}`, "dim", 10);
          break;

        case 'BRIEF':
          renderNodeBriefing();
          break;

        case 'HINT':
          printLine(`[HANDLER HINT]: ${NODES[gameState.currentNode].hint}`, "warn", 12);
          break;

        case 'UNLOCK':
        case 'OVERRIDE':
          verifyAnswer(arg);
          break;

        case 'CLEAR':
          outputElem.innerHTML = '';
          break;

        case 'RESET':
          try { localStorage.removeItem('dragoncon_arg_state'); } catch(e) {}
          gameState = { currentNode: 1, unlockedNodes: [], completed: false };
          initTerminal();
          break;

        default:
          const currentSolution = NODES[gameState.currentNode].solution;
          if (cmd === currentSolution || input.toUpperCase() === currentSolution) {
            verifyAnswer(currentSolution);
          } else {
            printLine(`Unknown command: '${cmd}'. Type 'HELP' for commands.`, "alert", 10);
          }
          break;
      }
    }

    inputElem.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        processCommand(inputElem.value);
        inputElem.value = '';
      }
    });

    initTerminal();
  </script>
</body>
</html>
