<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>A.G.E.N.T. Terminal // DragonCon Grid</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --term-green: #00ff66;
      --term-dim: #008837;
      --term-alert: #ff3333;
      --term-warn: #ffcc00;
      --font-stack: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--term-green);
      font-family: var(--font-stack);
      overflow: hidden;
      position: fixed;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px;
      height: 100dvh; /* Adapts cleanly to mobile Safari toolbars */
    }

    .terminal-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      flex: 1; /* Automatically expands to take remaining top space */
      min-height: 0; /* Prevents overflow pushing elements off screen */
      background: #050709;
      border: 2px solid var(--term-green);
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .terminal-header {
      background-color: rgba(0, 255, 102, 0.1);
      border-bottom: 1px solid var(--term-green);
      padding: 6px 10px;
      font-size: 0.7rem;
      display: flex;
      justify-content: space-between;
      text-transform: uppercase;
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    .terminal-body {
      flex: 1;
      padding: 8px 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.8rem;
      line-height: 1.3;
      -webkit-overflow-scrolling: touch;
    }

    .line {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .typing::after {
      content: '█';
      animation: blink 0.7s infinite;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .system { color: var(--term-green); }
    .dim { color: var(--term-dim); }
    .alert { color: var(--term-alert); font-weight: bold; }
    .warn { color: var(--term-warn); }
    .user-input { color: #ffffff; }

    /* INTEGRATED TERMINAL INPUT BAR */
    .terminal-input-line {
      display: flex;
      align-items: center;
      padding: 6px 10px;
      border-top: 1px solid var(--term-dim);
      background: #080a0d;
      flex-shrink: 0;
      height: 36px;
    }

    .prompt {
      color: var(--term-green);
      margin-right: 6px;
      font-weight: bold;
      font-size: 0.75rem;
    }

    .virtual-display {
      flex: 1;
      color: #ffffff;
      font-family: var(--font-stack);
      font-size: 0.85rem;
      min-height: 18px;
      display: flex;
      align-items: center;
    }

    .cursor {
      display: inline-block;
      width: 7px;
      height: 14px;
      background: var(--term-green);
      margin-left: 2px;
      animation: blink 0.8s infinite;
    }

    /* ON-SCREEN RETRO KEYBOARD */
    .virtual-keyboard {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #080a0d;
      border: 1px solid var(--term-dim);
      border-radius: 6px;
      padding: 6px 4px;
      flex-shrink: 0;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 3px;
      width: 100%;
    }

    .key {
      flex: 1;
      height: 36px;
      background: #12161c;
      border: 1px solid var(--term-dim);
      border-radius: 4px;
      color: var(--term-green);
      font-family: var(--font-stack);
      font-size: 0.85rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .key:active {
      background: var(--term-green);
      color: #000000;
    }

    .key-wide { flex: 1.5; }
    .key-space { flex: 4; }
    .key-enter { background: rgba(0, 255, 102, 0.15); border-color: var(--term-green); }

    /* RETRO DYSENTERY OVERLAY */
    #death-screen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 10px;
      font-family: "Courier New", Courier, monospace;
      animation: flashRed 0.4s ease-out;
      overflow: hidden;
    }

    @keyframes flashRed {
      0% { background-color: #ff0000; }
      100% { background-color: #000000; }
    }

    .tombstone {
      white-space: pre;
      color: #ffffff;
      font-size: 0.45rem;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .death-text {
      color: #ff3333;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .retry-prompt {
      color: #888888;
      font-size: 0.7rem;
      animation: blink 1s infinite;
    }
  </style>
</head>
<body>

  <div class="terminal-container">
    <div class="terminal-header">
      <span>SYS_NAME: DRAGON_NET_V2.6</span>
      <span id="node-status">STATUS: ONLINE</span>
    </div>

    <div class="terminal-body" id="terminal-body"></div>

    <!-- TERMINAL INPUT BAR -->
    <div class="terminal-input-line">
      <span class="prompt">OPERATIVE@GRID:&gt;</span>
      <div class="virtual-display">
        <span id="command-text"></span><span class="cursor"></span>
      </div>
    </div>

    <!-- DYSENTERY OVERLAY -->
    <div id="death-screen" onclick="dismissDeathScreen()">
      <div class="tombstone">
       /-------------------\
      /     R. I. P.        \
     /                       \
    |   HERE LIES AN OPERATIVE|
    |                         |
    |   DIED OF DYSENTERY     |
    |                         |
    |    ON THE TRAIL TO      |
    |       DRAGONCON         |
    |_________________________|
      </div>
      <div class="death-text">YOU HAVE DIED OF DYSENTERY.</div>
      <div class="retry-prompt">[ TAP SCREEN TO RETRY ]</div>
    </div>
  </div>

  <!-- ON-SCREEN KEYBOARD -->
  <div class="virtual-keyboard">
    <div class="kb-row">
      <button class="key" onclick="pressKey('1')">1</button>
      <button class="key" onclick="pressKey('2')">2</button>
      <button class="key" onclick="pressKey('3')">3</button>
      <button class="key" onclick="pressKey('4')">4</button>
      <button class="key" onclick="pressKey('5')">5</button>
      <button class="key" onclick="pressKey('6')">6</button>
      <button class="key" onclick="pressKey('7')">7</button>
      <button class="key" onclick="pressKey('8')">8</button>
      <button class="key" onclick="pressKey('9')">9</button>
      <button class="key" onclick="pressKey('0')">0</button>
    </div>
    <div class="kb-row">
      <button class="key" onclick="pressKey('Q')">Q</button>
      <button class="key" onclick="pressKey('W')">W</button>
      <button class="key" onclick="pressKey('E')">E</button>
      <button class="key" onclick="pressKey('R')">R</button>
      <button class="key" onclick="pressKey('T')">T</button>
      <button class="key" onclick="pressKey('Y')">Y</button>
      <button class="key" onclick="pressKey('U')">U</button>
      <button class="key" onclick="pressKey('I')">I</button>
      <button class="key" onclick="pressKey('O')">O</button>
      <button class="key" onclick="pressKey('P')">P</button>
    </div>
    <div class="kb-row">
      <button class="key" onclick="pressKey('A')">A</button>
      <button class="key" onclick="pressKey('S')">S</button>
      <button class="key" onclick="pressKey('D')">D</button>
      <button class="key" onclick="pressKey('F')">F</button>
      <button class="key" onclick="pressKey('G')">G</button>
      <button class="key" onclick="pressKey('H')">H</button>
      <button class="key" onclick="pressKey('J')">J</button>
      <button class="key" onclick="pressKey('K')">K</button>
      <button class="key" onclick="pressKey('L')">L</button>
    </div>
    <div class="kb-row">
      <button class="key" onclick="pressKey('Z')">Z</button>
      <button class="key" onclick="pressKey('X')">X</button>
      <button class="key" onclick="pressKey('C')">C</button>
      <button class="key" onclick="pressKey('V')">V</button>
      <button class="key" onclick="pressKey('B')">B</button>
      <button class="key" onclick="pressKey('N')">N</button>
      <button class="key" onclick="pressKey('M')">M</button>
      <button class="key key-wide" onclick="pressKey('BACK')">⌫</button>
    </div>
    <div class="kb-row">
      <button class="key key-space" onclick="pressKey(' ')">SPACE</button>
      <button class="key key-wide key-enter" onclick="submitCommand()">ENTER</button>
    </div>
  </div>

  <script>
    let gameState = {
      currentNode: 1,
      unlockedNodes: [],
      completed: false
    };

    try {
      localStorage.removeItem('dragoncon_arg_state');
    } catch(e) {}

    const NODES = {
      1: {
        title: "NODE 1: Authentication Gate",
        location: "Command Access",
        briefing: "To enter the game, enter this word that Liam has everyone yell for the password… but is commonly misspelled.",
        solution: "PINUS",
        hint: "It's five letters, starts with P, ends with S... think pine tree genus spelling!",
        successText: "ACCESS GRANTED. Passphrase verified. System authenticated!"
      },
      2: {
        title: "NODE 2: KWANGYA SYNK Matrix",
        location: "Flat / Wilderness Grid",
        briefing: "SECURITY CHECK 2: Multiply the number of aespa members (4) by 2016 (SM Culture Tech unveiling). Add 23 (Atomic weight of Na for Naevis).\nTarget Format: UNLOCK [NUMBER]",
        solution: "8087",
        hint: "(4 * 2016) + 23.",
        successText: "SYNK LEVEL 100%. NAEVIS LINK ESTABLISHED. Node 2 online."
      },
      3: {
        title: "NODE 3: EXOPLANET Force Field",
        location: "EXOPLANET Command Core",
        briefing: "FINAL OVERRIDE: Add original EXO member count (12) to EXO-K debut year (2012), then subtract the total number of member superpowers (12).\nTarget Format: OVERRIDE [NUMBER]",
        solution: "2012",
        hint: "12 + 2012 - 12.",
        successText: "EXOPLANET FORCE FIELD DEACTIVATED. MAINFRAME RESTORED!"
      }
    };

    const outputElem = document.getElementById('terminal-body');
    const commandTextElem = document.getElementById('command-text');
    const statusElem = document.getElementById('node-status');
    const deathScreen = document.getElementById('death-screen');

    let currentInput = "";
    let printQueue = [];
    let isTyping = false;

    function pressKey(char) {
      if (deathScreen.style.display === 'flex') {
        dismissDeathScreen();
        return;
      }

      if (char === 'BACK') {
        currentInput = currentInput.slice(0, -1);
      } else {
        if (currentInput.length < 30) {
          currentInput += char;
        }
      }
      commandTextElem.textContent = currentInput;
    }

    function submitCommand() {
      if (deathScreen.style.display === 'flex') {
        dismissDeathScreen();
        return;
      }

      if (!currentInput.trim()) return;
      
      const textToProcess = currentInput;
      currentInput = "";
      commandTextElem.textContent = "";
      processCommand(textToProcess);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        submitCommand();
      } else if (e.key === 'Backspace') {
        pressKey('BACK');
      } else if (e.key.length === 1) {
        pressKey(e.key.toUpperCase());
      }
    });

    function printLine(text, classType = 'system', speed = 12) {
      printQueue.push({ text, classType, speed });
      if (!isTyping) {
        processQueue();
      }
    }

    function processQueue() {
      if (printQueue.length === 0) {
        isTyping = false;
        return;
      }

      isTyping = true;
      const { text, classType, speed } = printQueue.shift();
      const line = document.createElement('div');
      line.className = `line ${classType} typing`;
      outputElem.appendChild(line);

      let index = 0;

      function typeNextChar() {
        if (index < text.length) {
          line.textContent += text.charAt(index);
          index++;
          outputElem.scrollTop = outputElem.scrollHeight;
          setTimeout(typeNextChar, speed);
        } else {
          line.classList.remove('typing');
          setTimeout(processQueue, 20);
        }
      }

      typeNextChar();
    }

    function updateStatusUI() {
      if (gameState.completed) {
        statusElem.textContent = "STATUS: SECURED";
      } else {
        statusElem.textContent = `NODE ${gameState.currentNode}/3 ACTIVE`;
      }
    }

    function clearScreen() {
      outputElem.innerHTML = '';
      printQueue = [];
      isTyping = false;
    }

    function renderNodePage() {
      clearScreen();
      
      if (gameState.completed) {
        printLine("==================================================", "system", 5);
        printLine("MISSION COMPLETE. ALL MAINFRAME NODES SECURED.", "system", 15);
        printLine("==================================================", "system", 5);
        return;
      }

      const activeNode = NODES[gameState.currentNode];
      printLine(`==================================================`, "system", 5);
      printLine(`  ${activeNode.title.toUpperCase()}`, "warn", 10);
      printLine(`==================================================`, "system", 5);
      printLine(`LOCATION TARGET: ${activeNode.location}`, "dim", 10);
      printLine(`DIRECTIVE: ${activeNode.briefing}\n`, "system", 10);
      printLine("Type 'HELP' for available directives.", "dim", 10);
    }

    function showDysenteryDeath() {
      deathScreen.style.display = 'flex';
    }

    function dismissDeathScreen() {
      deathScreen.style.display = 'none';
    }

    function verifyAnswer(submittedText) {
      if (gameState.completed) {
        return;
      }

      const currentNodeData = NODES[gameState.currentNode];
      const cleanSubmission = submittedText.trim().toUpperCase();

      if (cleanSubmission === currentNodeData.solution) {
        gameState.unlockedNodes.push(gameState.currentNode);
        
        if (gameState.currentNode < 3) {
          gameState.currentNode++;
          updateStatusUI();
          renderNodePage();
        } else {
          gameState.completed = true;
          updateStatusUI();
          renderNodePage();
        }
      } else {
        showDysenteryDeath();
      }
    }

    function processCommand(rawInput) {
      const input = rawInput.trim();
      if (!input) return;

      const parts = input.split(' ');
      const cmd = parts[0].toUpperCase();
      const arg = parts.slice(1).join(' ').trim();

      switch (cmd) {
        case 'HELP':
          printLine(`OPERATIVE@GRID:> ${input}`, "user-input", 5);
          printLine("AVAILABLE COMMANDS:", "system", 10);
          printLine("  STATUS          - Display overall progress.", "dim", 8);
          printLine("  BRIEF           - Reload current objective page.", "dim", 8);
          printLine("  HINT            - Request tactical hint.", "dim", 8);
          printLine("  CLEAR           - Clear display screen.", "dim", 8);
          printLine("  RESET           - Reset game save data.", "dim", 8);
          break;

        case 'STATUS':
          printLine(`OPERATIVE@GRID:> ${input}`, "user-input", 5);
          printLine(`Current Node: ${gameState.currentNode} / 3`, "system", 10);
          printLine(`Unlocked Nodes: ${gameState.unlockedNodes.join(', ') || 'None'}`, "dim", 10);
          break;

        case 'BRIEF':
          renderNodePage();
          break;

        case 'HINT':
          printLine(`OPERATIVE@GRID:> ${input}`, "user-input", 5);
          printLine(`[HANDLER HINT]: ${NODES[gameState.currentNode].hint}`, "warn", 12);
          break;

        case 'CLEAR':
          clearScreen();
          break;

        case 'RESET':
          gameState = { currentNode: 1, unlockedNodes: [], completed: false };
          updateStatusUI();
          renderNodePage();
          break;

        case 'UNLOCK':
        case 'OVERRIDE':
          verifyAnswer(arg);
          break;

        default:
          verifyAnswer(input);
          break;
      }
    }

    updateStatusUI();
    renderNodePage();
  </script>
</body>
</html>
